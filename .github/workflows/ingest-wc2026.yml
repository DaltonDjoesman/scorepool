name: Ingest WC2026 fixtures

on:
  workflow_dispatch: {}
  schedule:
    # Near-real-time enough for a pool app; adjust later.
    - cron: "*/5 * * * *"

concurrency:
  group: ingest-wc2026
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install deps (functions)
        working-directory: functions
        run: npm ci

      - name: Write Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p /tmp/firebase
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase/sa.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/firebase/sa.json','utf8')); console.log('service account JSON ok')"

      - name: Ingest fixtures into Firestore
        working-directory: functions
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase/sa.json
        run: npm run ingest:wc2026

