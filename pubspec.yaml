name: worldcupbettracker_app
description: "CopaBolão 2026 — Flutter app for exact-score World Cup betting pools with friends."
publish_to: "none"

version: 1.0.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.1.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.1
  firebase_messaging: ^16.4.1
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  fake_cloud_firestore: ^4.2.0
  firebase_auth_mocks: ^0.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
